<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragmentos :: head('Roles')}"></head>
    <body class="bg-light">
        <header th:replace="~{layout/fragmentos :: header}"></header>
        <div th:replace="~{layout/fragmentos :: mensajes}"></div>

        <div class="container my-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icono-circulo bg-info-subtle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="5" width="16" height="15" rx="2" stroke="#0dcaf0" stroke-width="1.6"/>
                        <path d="M4 10H20" stroke="#0dcaf0" stroke-width="1.6"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-info-emphasis mb-0">Roles del sistema</h2>
                        <p class="text-secondary small mb-0">Define los perfiles disponibles para las cuentas.</p>
                    </div>
                </div>
                <a class="btn btn-info text-white px-3" th:href="@{/rol/nuevo}">Agregar rol</a>
            </div>

            <div class="panel-datos bg-white shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-info">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="rol : ${roles}">
                            <td th:text="${rol.id}"></td>
                            <td th:text="${rol.nombre}"></td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-info" th:href="@{/rol/editar/{id}(id=${rol.id})}">Modificar</a>
                                <form class="d-inline" method="post" th:action="@{/rol/eliminar}"
                                      onsubmit="return confirm('Se eliminara este rol. ¿Continuar?');">
                                    <input type="hidden" name="id" th:value="${rol.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Quitar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roles)}">
                            <td colspan="3" class="text-center text-secondary py-4">Aun no se han registrado roles.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer th:replace="~{layout/fragmentos :: footer}"></footer>
    </body>
</html>
