<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragmentos :: head('Rol')}"></head>
<body class="bg-light">
    <header th:replace="~{layout/fragmentos :: header}"></header>

    <div class="container my-4">
        <div class="row justify-content-center g-4">
            <div class="col-lg-3">
                <div class="p-3">
                    <div class="icono-circulo bg-info-subtle mb-2">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="4" y="5" width="16" height="15" rx="2" stroke="#0dcaf0" stroke-width="1.6"/>
                            <path d="M4 10H20" stroke="#0dcaf0" stroke-width="1.6"/>
                        </svg>
                    </div>
                    <h5 class="text-info-emphasis" th:text="${rol.id} != null ? 'Editar rol' : 'Nuevo rol'"></h5>
                    <p class="text-secondary small">
                        Usa nombres cortos y claros, por ejemplo ADMIN, MEDICO o PACIENTE,
                        para que sean faciles de asignar despues.
                    </p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form method="post" th:action="@{/rol/guardar}" th:object="${rol}">
                            <input type="hidden" th:field="*{id}"/>
                            <div class="mb-3">
                                <label class="form-label">Nombre del rol</label>
                                <input type="text" class="form-control" th:field="*{nombre}"
                                       placeholder="Ej: ADMIN, MEDICO, PACIENTE" required/>
                                <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}"
                                     th:errors="*{nombre}"></div>
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a class="btn btn-outline-secondary" th:href="@{/rol/listado}">Cancelar</a>
                                <button type="submit" class="btn btn-info text-white px-4">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout/fragmentos :: footer}"></footer>
</body>
</html>
