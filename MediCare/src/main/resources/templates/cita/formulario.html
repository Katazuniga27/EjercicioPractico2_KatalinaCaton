<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragmentos :: head('Cita Medica')}"></head>
    <body class="bg-light">
        <header th:replace="~{layout/fragmentos :: header}"></header>

        <div class="container my-4">
            <div class="row justify-content-center g-4">
                <div class="col-lg-3">
                    <div class="p-3">
                        <div class="icono-circulo bg-info-subtle mb-2">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3L14.2 9.2L21 9.9L15.8 14.1L17.4 21L12 17.3L6.6 21L8.2 14.1L3 9.9L9.8 9.2L12 3Z" stroke="#0dcaf0" stroke-width="1.4" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <h5 class="text-info-emphasis" th:text="${cita.id} != null ? 'Editar cita medica' : 'Nueva cita medica'"></h5>
                        <p class="text-secondary small">
                            Registra el nombre del paciente, la especialidad y la fecha
                            acordada. Puedes marcar la cita como inactiva si se cancela.
                        </p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form method="post" th:action="@{/cita/guardar}" th:object="${cita}">
                                <input type="hidden" th:field="*{id}"/>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Nombre del paciente</label>
                                        <input type="text" class="form-control" th:field="*{pacienteNombre}" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('pacienteNombre')}"
                                             th:errors="*{pacienteNombre}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Especialidad</label>
                                        <input type="text" class="form-control" th:field="*{especialidad}" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('especialidad')}"
                                             th:errors="*{especialidad}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Fecha de la cita</label>
                                        <input type="date" class="form-control" th:field="*{fecha}" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('fecha')}"
                                             th:errors="*{fecha}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Costo (₡)</label>
                                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{costo}" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('costo')}"
                                             th:errors="*{costo}"></div>
                                    </div>

                                    <div class="col-12">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" th:field="*{activa}" id="activa"/>
                                            <label class="form-check-label" for="activa">Cita vigente</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <a class="btn btn-outline-secondary" th:href="@{/cita/listado}">Cancelar</a>
                                    <button type="submit" class="btn btn-info text-white px-4">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{layout/fragmentos :: footer}"></footer>
    </body>
</html>
