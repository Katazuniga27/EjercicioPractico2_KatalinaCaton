<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragmentos :: head('Usuarios')}"></head>
    <body class="bg-light">
        <header th:replace="~{layout/fragmentos :: header}"></header>
        <div th:replace="~{layout/fragmentos :: mensajes}"></div>

        <div class="container my-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="icono-circulo bg-info-subtle">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" stroke="#0dcaf0" stroke-width="1.6"/>
                        <path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke="#0dcaf0" stroke-width="1.6"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-info-emphasis mb-0">Cuentas de usuario</h2>
                        <p class="text-secondary small mb-0">Alta, edicion y baja de accesos al sistema.</p>
                    </div>
                </div>
                <a class="btn btn-info text-white px-3" th:href="@{/usuario/nuevo}">Agregar usuario</a>
            </div>

            <div class="panel-datos bg-white shadow-sm">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-info">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Fecha creacion</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios}">
                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.nombre}"></td>
                            <td th:text="${usuario.email}"></td>
                            <td>
                                <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle"
                                      th:text="${usuario.rol.nombre}"></span>
                            </td>
                            <td>
                                <span th:class="${usuario.activo} ? 'badge bg-success' : 'badge bg-secondary'"
                                      th:text="${usuario.activo} ? 'Activo' : 'Inactivo'"></span>
                            </td>
                            <td th:text="${#temporals.format(usuario.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-info" th:href="@{/usuario/editar/{id}(id=${usuario.id})}">Modificar</a>
                                <form class="d-inline" method="post" th:action="@{/usuario/eliminar}"
                                      onsubmit="return confirm('Se eliminara este usuario. ¿Continuar?');">
                                    <input type="hidden" name="id" th:value="${usuario.id}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Quitar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="7" class="text-center text-secondary py-4">Aun no se han registrado usuarios.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer th:replace="~{layout/fragmentos :: footer}"></footer>
    </body>
</html>
