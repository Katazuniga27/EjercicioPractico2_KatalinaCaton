<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout/fragmentos :: head('Usuario')}"></head>
    <body class="bg-light">
        <header th:replace="~{layout/fragmentos :: header}"></header>

        <div class="container my-4">
            <div class="row justify-content-center g-4">
                <div class="col-lg-3">
                    <div class="p-3">
                        <div class="icono-circulo bg-info-subtle mb-2">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" stroke="#0dcaf0" stroke-width="1.6"/>
                            <path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke="#0dcaf0" stroke-width="1.6"/>
                            </svg>
                        </div>
                        <h5 class="text-info-emphasis" th:text="${usuario.id} != null ? 'Editar usuario' : 'Nuevo usuario'"></h5>
                        <p class="text-secondary small">
                            La contrasena solo es obligatoria al crear la cuenta. Si editas un
                            usuario existente, dejala en blanco para conservar la actual.
                        </p>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form method="post" th:action="@{/usuario/guardar}" th:object="${usuario}">
                                <input type="hidden" th:field="*{id}"/>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Nombre completo</label>
                                        <input type="text" class="form-control" th:field="*{nombre}" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}"
                                             th:errors="*{nombre}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Correo electronico</label>
                                        <input type="email" class="form-control" th:field="*{email}" required/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}"
                                             th:errors="*{email}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Contrasena</label>
                                        <input type="password" class="form-control" th:field="*{password}"
                                               th:placeholder="${usuario.id} != null ? 'Dejar en blanco para no cambiarla' : ''"/>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}"
                                             th:errors="*{password}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label">Rol</label>
                                        <select class="form-select" th:field="*{rol}" required>
                                            <option value="">-- Seleccione un rol --</option>
                                            <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
                                        </select>
                                        <div class="text-danger small" th:if="${#fields.hasErrors('rol')}"
                                             th:errors="*{rol}"></div>
                                    </div>

                                    <div class="col-12">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo"/>
                                            <label class="form-check-label" for="activo">Cuenta habilitada</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <a class="btn btn-outline-secondary" th:href="@{/usuario/listado}">Cancelar</a>
                                    <button type="submit" class="btn btn-info text-white px-4">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{layout/fragmentos :: footer}"></footer>
    </body>
</html>
